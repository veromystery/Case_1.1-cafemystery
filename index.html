<style>
:root{--bg:#040b05;--gold:#c9a55c;--cream:#efe3c4;--dim:#9c8e6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:radial-gradient(ellipse 90% 60% at 50% 0%,#1a4a32 0%,#0d2a1c 45%,#06130b 100%) fixed,var(--bg);min-height:100%}body{margin:0;color:var(--cream);font-family:Cairo,Tahoma,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 48px}
.logo{mix-blend-mode:lighten;width:min(560px,100%);display:block;-webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 55%,transparent 100%)}
main{width:min(520px,100%);text-align:center;margin-top:8px}
.stage{display:none}.stage.on{display:block;animation:in .8s ease both}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}.nav button{margin-top:0;background:transparent;color:var(--gold);border:1px solid var(--gold);padding:10px 22px;font-weight:600}.solved{color:var(--gold);font-size:1.15rem;margin:0}@keyframes in{from{opacity:0}to{opacity:1}}
.note{font-size:1.2rem;line-height:2;color:var(--cream);margin:0 0 28px;padding:16px 18px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
h2{font-weight:700;font-size:1.8rem;margin:0 0 14px;color:var(--gold)}
input{width:100%;font:inherit;font-size:1.25rem;text-align:center;color:var(--cream);background:rgba(239,227,196,.05);border:1px solid var(--dim);border-radius:2px;padding:14px;outline:none}
input::placeholder{color:var(--dim)}
input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,165,92,.35)}
button{margin-top:14px;font:inherit;font-size:1.2rem;font-weight:700;color:var(--bg);background:var(--gold);border:0;border-radius:2px;padding:12px 40px;cursor:pointer}
button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.note.long{text-align:right;font-size:1.1rem}.err{min-height:1.8em;margin:12px 0 0;color:#d98a7a;font-size:1.05rem}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.stage.on,.shake{animation:none}}

 {title:"خلف المرآة", long:1, note:"طلب المحقق من الجميع البقاء في أماكنهم، ثم بدأ بتفتيش المقهى.<br><br>كانت المرآة خلف منضدة النادل تبدو عادية، إلا أن إطارها الخشبي يحمل خدوشاً من الحائط. وعندما أزاحها المحقق عن الحائط، اكتشف تجويفاً ضيقاً يحتوي على مفتاح نحاسي وصورة قديمة للمقهى.<br><br>في الصورة، ظهر ثلاثة أشخاص يقفون أمام الباب: صاحب المقهى السابق، وشاب يشبه نادر، ورجل مسنّ يحمل ساعة جيب.<br><br>على ظهر الصورة كُتبت عبارة:<br><br>«بعض الديون لا تُسدّد بالمال».<br><br>سأل المحقق سامر عن الصورة.<br><br>تغيّر لون وجهه.<br><br>— هذا المقهى كان ملكاً لأبي. قبل خمسة عشر عاماً، اختفى شريكه في ظروف غامضة. وبعد أسبوع، احترق مخزن المقهى، وأُغلقت القضية باعتبارها حادثاً.<br><br>— وما علاقة نادر بذلك؟<br><br>— لا أعرف. لكنه زارني قبل ثلاثة أيام، وسألني عن الصورة نفسها.<br><br>اقترب المحقق من المرأة ذات المعطف الأسود.<br><br>— أنتِ تعرفين شيئاً عن تلك الليلة، أليس كذلك؟<br><br>أجابت بعد تردد:<br><br>— اسمي ليلى. كنت ابنة شريك والد سامر. أبي اختفى، والجميع قال إنه هرب، لكنني لم أصدّق ذلك قط.<br><br>— ولماذا جئتِ الليلة؟<br><br>— لأن نادر أرسل لي رسالة قال فيها إنه وجد الدليل الذي يثبت ما حدث لأبي.<br><br>أخرجت هاتفها، وأرت المحقق الرسالة. كانت قد وصلتها قبل ساعة واحدة فقط:<br><br>«إذا حدث لي شيء، فلا تثقي بالساعة. الحقيقة خلف الوجه الذي يراك كل ليلة».<br><br>نظر المحقق إلى المرآة مجدداً.<br><br>ثم اكتشف أن انعكاس منضدة النادل لا يتطابق تماماً مع شكلها الحقيقي؛ فهناك جزء من الخشب يبدو أغمق من بقية الأجزاء.<br><br>طرق عليه، فصدر صوت أجوف.<br><br>كان داخل المنضدة درج مخفي، وفيه قصاصة صحيفة قديمة وخريطة صغيرة للمبنى. أظهرت الخريطة ممراً ضيقاً يصل المخزن القديم بالقبو، لكن مدخله كان مخفياً خلف رفّ في صالة.<br><br>أما قصاصة الصحيفة، فقد احتوت على خبر عن اختفاء شريك صاحب المقهى، وتحت الخبر خط أحمر حول جملة واحدة:<br><br>«آخر من شوهد معه كان المحاسب المسؤول عن سجلات المقهى».<br><br>رفع المحقق رأسه ببطء وسأل النادل.<br><br>— من كان محاسب المقهى آنذاك؟<br><br>أجاب سامر:<br><br>— الرجل الذي يجلس قرب الباب… إنه عمي فؤاد.<br><br>التفت الجميع إلى الرجل المسنّ، لكن كرسيه كان فارغاً.<br><br>اختفى دون أن يفتح الباب الرئيسي.<br><br>وترك الصحيفة على الطاولة مؤشراً بقلم ازرق على كلمة واحدة:<br><br>الساعة", placeholder:"ادخل الدليل الثاني", key:"الرجل المسن|رجل المسن|فؤاد"},
 {title:"ممر القبو السري", long:1, note:"أمر المحقق بإغلاق المقهى ومراقبة جميع المخارج. لم يكن من الممكن أن يغادر فؤاد دون أن يراه أحد، ومع ذلك اختفى كما لو أنه ذاب داخل الجدران.<br><br>عاد المحقق إلى خريطة المبنى، واكتشف وجود ممر سري تم اخفائه بواسطة رفّ خشبي. عندما سحب الرفّ، ظهر باب ضيق يؤدي إلى القبو.<br><br>نزل المحقق برفقة سامر، بينما بقيت ليلى في الأعلى.<br><br>كان القبو مليئاً بصناديق قديمة وأثاث مغطى بالغبار. وفي نهايته وجدو على الأرض آثار أقدام حديثة تنتهي أمام جدار حجري.<br><br>فحص المحقق الجدار، فاكتشف حجراً يتحرك عند الضغط عليه. خلفه، ظهر ممر ضيق يؤدي إلى غرفة صغيرة تحتوي على مكتب ودفاتر محاسبة محترقة جزئياً.<br><br>على المكتب، كان هناك جهاز تسجيل قديم.<br><br>ضغط المحقق زر التشغيل، فصدر صوت مشوّش، ثم سُمع رجل يقول:<br><br>— إذا وصلتَ إلى هذا التسجيل، فهذا يعني أنني لم أعد قادراً على إصلاح ما فعلته. لم يكن اختفاء شريكنا هروباً، ولم يكن الحريق حادثاً. لقد اكتشف أن الأموال تُسرق من حسابات المقهى، وأن هناك وثائق تثبت ذلك.  لكن شخصاً آخر …<br><br>انقطع التسجيل.<br><br>حاول المحقق تشغيله مجدداً، لكن الشريط توقف عند الموضع نفسه.<br><br>استدار المحقق فرأى سامر واقفاً أمام الباب، يحمل دفتراً أسود.<br><br>— وجدته داخل الصندوق الأخير، قال سامر. أعتقد أن هذا ما كان نادر يبحث عنه.<br><br>فتح المحقق الدفتر. كانت صفحاته مليئة بأرقام وتواريخ وأسماء، لكن صفحة واحدة فقط كانت ممزقة من المنتصف.<br><br>عاد المحقق إلى الأعلى، حيث وجد ليلى تقف أمام الطاولة الضحية.<br><br>قالت له:<br><br>— نادر أخبرني أن لديه نسخة من الدفتر. لكنه قال إن النسخة الحقيقية ليست ورقية.<br><br>— أين هي؟<br><br>نظرت إلى الفنجان الفارغ.<br><br>— قال إن الحقيقة محفوظة في شيء يشربه الناس كل يوم، ثم ينسونه فوراً.<br><br>فهم المحقق أن نادر ترك وراءه دليلاً آخر، لكن لم يكن يعرف أين يبحث.<br><br>عندها، لاحظ شيئاً في صورة المقهى القديمة: الرجل الذي يقف بجانب نادر كان يحمل ساعة جيب، وعلى غطائها نقش واضح.<br><br>لم يكن اسماً، بل رقماً:", placeholder:"ادخل الدليل الثالث", key:"سبعة|7"},
 {title:"الطاولة رقم 7", long:1, note:"عاد المحقق إلى الطاولة رقم 7، وبدأ يفحص كل ما عليها. رفع الفنجان، وتفحّص الصحن، ثم مرّر يده أسفل الطاولة حتى شعر بقطعة معدنية صغيرة مثبتة في الخشب.<br><br>كانت بطاقة ذاكرة .<br><br>عرض محتوياتها على حاسوبه المحمول، فوجد ملفاً صوتياً قصيراً وصورة لوثيقة مصرفية.<br><br>أظهرت الوثيقة تحويلات مالية مشبوهة تمت على مدى سنوات، وكان اسم فؤاد يتكرر فيها بصفته المحاسب المسؤول. لكن اسم المستفيد النهائي كان محجوباً.<br><br>أما التسجيل، فكان بصوت نادر:<br><br>«إذا كنت تستمع إلى هذا، فقد حدث ما كنت أخشاه. اكتشفت أن فؤاد لم يكن يعمل وحده. لقد ساعده شخص من داخل المقهى على إخفاء الأدلة، لكنني لا أملك ما يكفي لإثبات هويته. الليلة سأواجهه، وسأطلب منه أن يعترف بما حدث لشريكه القديم. إذا رفض، سأكشف كل شيء».<br><br>توقف التسجيل لثوانٍ، ثم عاد صوت نادر أكثر انخفاضاً:<br><br>«هناك أمر آخر. الشخص الذي رأيته في المرآة لم يكن يقف خلفي… ».<br>توقف التسجيل<br>أعاد المحقق التسجيل مرات عدة.<br><br>ثم أدرك أن المرآة لم تكن مجرد وسيلة لإخفاء الصورة داخل الفجوة خلفها. كانت أيضاً تمنح الجالس أمامها القدرة على رؤية حركة الغرفة دون أن يلتفت.<br><br>الشخص الذي جلس أمام المرآة تلك الليلة، ياسر، كان يستطيع مراقبة الجميع.<br><br>لكن هل كان هو القاتل؟<br><br>استدعاه المحقق وسأله عن علاقته بنادر.<br><br>أجاب ياسر:<br><br>— لم أكن أعرفه إلا من ثلاثة أيام. كان يعتقد أنني أستطيع مساعدته في استعادة ملف قديم.<br><br>— أي ملف؟<br><br>— ملف يخص أبي. كان يعمل في المقهى قبل سنوات، ثم اختفى من المدينة بعد اتهامه بسرقة الأموال.<br><br>رفع المحقق نظره عن دفتر الملاحظات.<br><br>— هل كان اسم أبيك فؤاد؟<br><br>هزّ ياسر رأسه.<br><br>— لا. أبي هو الشريك الذي اختفى.<br><br>ساد الصمت.<br><br>كانت ليلى ابنة الرجل المفقود، وياسر ابنه أيضاً، لكنهما لم يعرفا بوجود بعضهما بسبب ان والدتهما كانت مختلفة. نادر كان يجمع أبناء الرجل المفقود ليكشف لهم الحقيقة.<br><br>سأل المحقق ياسر:<br><br>— لماذا لم تخبرنا بذلك منذ البداية؟<br><br>— لأنني تلقيت رسالة من نادر تقول: «لا تثق بأحد حتى تسمع الاعتراف كاملاً».<br><br>في تلك اللحظة، انفتح باب القبو، وظهر فؤاد واقفاً عند نهايته.<br><br>لم يحاول الهرب هذه المرة.<br><br>قال بصوت متعب:<br><br>— نعم، سرقت الأموال. ونعم، ساعدني أحدهم على إخفاء السجلات. لكنني لم أقتل نادر.<br><br>اكتشف المحقق القاتل ولكن لم يكشفه للجميع بعد.<br>فقد بقيت قطعة واحدة من اللغز مفقودة: كيف مات نادر في غرفة مغلقة، ولماذا لم يرَ أحدٌ القاتل يقترب منه؟", placeholder:"ادخل الدليل الرابع", key:"النادل"},
 {title:"الساعة تشهد", long:1, note:"لم يعد المحقق بحاجة إلى مزيد من الأدلة، بل إلى ترتيب الأدلة التي امتلكها بالفعل.<br><br>جمع الجميع في وسط المقهى، ثم بدأ يشرح.<br><br>قبل خمسة عشر عاماً، اكتشف شريك صاحب المقهى أن فؤاد يختلس الأموال من حسابات المشروع. اتفق الرجلان على تسوية الأمر، لكن فؤاد أراد التخلص من السجلات التي تثبت تورطه.<br><br>في تلك الليلة، حدثت مواجهة في المقهى. اختفى الشريك، واحترق جزء من المخزن، وأُغلقت القضية باعتبارها حادثاً غامضاً.<br><br>لكن الشريك لم يكن قد هرب كما ظن الجميع. لقد أُخفيت الحقيقة، وتفرقت الأدلة بين الدفاتر القديمة والتسجيلات والصور.<br><br>كان نادر قد أعاد فتح القضية، وجمع الأدلة التي تربط فؤاد بسرقة الأموال. واكتشف أيضاً أن سامر يعرف بوجود الممر السري خلف الرفّ، وأنه استخدمه في مناسبات سابقة لإخفاء بعض السجلات.<br><br>قال المحقق:<br><br>— سامر، أنت لم تكن مجرد نادل في تلك الليلة. كنت تعرف أن نادر سيكشف كل شيء، وكنت تخشى أن يربط اسمك بالوثائق التي أخفيتها.<br><br>حاول سامر الاعتراض، لكن المحقق تابع:<br><br>— بقعة الحبر الأزرق على الفنجان لم تكن دليلاً على القتل بحد ذاتها. لكنها ربطت الفنجان بالدفتر الذي كنت تستخدمه لتسجيل طلبات الزبائن، وكنت تعرف أن الممر خلف الرفّ يتيح له الوصول إلى القبو والخروج من الغرفة كما استغلها عمهُ فؤاد دون المرور بالباب الرئيسي. أما انطفاء الأنوار، فكان قد دبّره باستخدام مفتاح الكهرباء الموجود قرب المنضدة، مستفيداً من انشغال الجميع بالمطر والضوضاء ليوهم الجميع ان حادث القتل حصل اثناء انطفاء الكهرباء.<br><br>أما سبب وفاة نادر الدقيق، فقد احتاج إلى تقرير الطب الشرعي؛ ولم يكن ممكناً إثباته من شكل الفنجان أو انقطاع الأنوار وحدهما.<br>لكن التقرير أكد وجود مادة سامة في جسمه، وأنها وصلت إليه قبل انطفاء الإضاءة، لا أثناء الظلام.<br><br>سأل المحقق. سامر:<br><br>— لماذا فعلت ذلك؟<br><br>ظل سامر صامتاً طويلاً، ثم قال:<br><br>— لأن نادر كان سيهدم كل شيء. واعرف ان ابي كان متورطا في اختلاس الاموال مع عمي ولكن لم ارد ان اخسر الشي الوحيد المتبقي لي من والدي أردت أن تختفي الأدلة كما اختفى الرجل قبل خمسة عشر عاماً.<br><br>— لكنك لم تُخفِ الحقيقة، قال المحقق. أنت فقط جعلت الوصول إليها أصعب.<br><br>اقتربت ليلى من الطاولة رقم 7، ونظرت إلى الصورة القديمة للمقهى.<br><br>— إذن أبي لم يهرب؟<br><br>أجاب المحقق بهدوء:<br><br>— الأدلة التي وجدناها تثبت وجود جريمة قديمة وإخفاء متعمد للمعلومات، لكنها لا تكفي وحدها لحسم مصير والدك. سنعيد فتح القضية ونبحث عن بقية الأدلة.<br><br>أُوقِفَ سامر للتحقيق في مقتل نادر وإخفاء الأدلة، كما فُتحت قضية فؤاد من جديد بسبب التلاعب بالسجلات المالية والبحث عن والد ليلى وياسر.<br><br>وقبل أن يغادر المحقق المقهى، عاد إلى الساعة المتوقفة. أزال غطاءها الخلفي، فوجد ورقة صغيرة مطوية بعناية.<br><br>فتحها، فقرأ بخط نادر:<br><br>«الحقيقة لا تختفي عندما يتوقف الزمن. إنها تنتظر فقط الشخص الذي يجرؤ على تحريك العقارب».<br><br>رفع المحقق عينيه إلى الساعة، ثم أعاد تركيب غطائها.<br><br>كانت تشير إلى التاسعة وسبع عشرة دقيقة.<br><br>وللمرة الأولى منذ خمسة عشر عاماً، لم تعد الساعة تبدو كأنها تخفي سراً.<br><br>بل كأنها تشهد عليه.<br><br>النهاية.", next:"احصل على الجائزة"},

function norm(s){return s.replace(/[\u064B-\u065F\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase()}
var app=document.getElementById("app"),cur=0,mx=0;
function show(i){
 cur=i;if(i>mx)mx=i;var s=STAGES[i],h='<section class="stage on">';
 if(s.title)h+='<h2>'+s.title+'</h2>';
 if(s.note)h+='<p class="note'+(s.long?' long':'')+'">'+s.note+'</p>';
 if(s.key&&i<mx)h+='<p class="solved">الدليل: '+s.key.split("|")[0]+'</p>';if(s.key&&i>=mx){h+='<input id="in" type="text" autocomplete="off" placeholder="'+s.placeholder+'" aria-label="'+s.placeholder+'"><button id="go" type="button">تحقق</button><p class="err" id="err" role="alert"></p>'}
 if(s.next)h+='<button id="nx" type="button">'+s.next+'</button>';if(mx>0)h+='<div class="nav">'+(i>0?'<button id="pv" type="button">→ السابق</button>':'<span></span>')+(i<mx?'<button id="nt" type="button">التالي ←</button>':'<span></span>')+'</div>';app.innerHTML=h+'</section>';var nx=document.getElementById("nx");if(nx)nx.onclick=function(){show(cur+1)};var pv=document.getElementById("pv"),nt=document.getElementById("nt");if(pv)pv.onclick=function(){show(cur-1)};if(nt)nt.onclick=function(){show(cur+1)};window.scrollTo(0,0);
 var inp=document.getElementById("in");
 if(inp){inp.focus({preventScroll:true});inp.addEventListener("keydown",function(e){if(e.key==="Enter")check()});document.getElementById("go").onclick=check}
}
function check(){
 var inp=document.getElementById("in"),err=document.getElementById("err");
 if(STAGES[cur].key.split("|").some(function(k){return STAGES[cur].exact?k===inp.value.trim():norm(k)===norm(inp.value)})){show(cur+1)}
 else{err.textContent="حاول مرة اخرى";inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake")}
}
show(0);
